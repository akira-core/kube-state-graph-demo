# The one deliberately fake component in the demo. A laptop cannot run an ONTAP
# array, so this stands in for NetApp Harvest and emits the same series
# kube-state-graph reads — against the PV names the real kind cluster assigned.
image:
  repository: ksg-demo/tools
  tag: local
  pullPolicy: Never

replicaCount: 1

# REQUIRED. Reads (discovery) go to a Prometheus-compatible read endpoint,
# writes (import) to vminsert. The two need not be the same installation: the
# faker discovers claims from the kube-state-metrics series and writes Harvest
# series, and those two families may well be stored apart.
vmSelectURL: ''
vmInsertURL: ''

# Optional. Name of an existing Secret holding `username` / `password` keys for
# basic auth against vmSelectURL. Unset means an unauthenticated read endpoint.
# There is deliberately no plaintext credential value here: a password in values
# ends up in the release's stored manifest, readable by anything that can read
# the release Secret.
vmSelectAuthSecret: ''

# Only claims on this StorageClass get a fake NetApp backend. Everything else
# keeps a bare PVC node, which is the point: the demo shows both the joined and
# the unjoined case side by side.
storageClass: netapp-nas

ontapCluster: ontap-lab
ontapSVM: svm_demo

# The provisioner's storagePrefix — what a FlexVol name carries in front of the
# transformed PV name (`pvc-<uuid>` becomes `trident_pvc_<uuid with _>`).
# kube-state-graph is never told this value: it suffix-matches, which is why a
# real estate resolves without declaring the prefix and why several backends
# with different prefixes all resolve. Change it and the storage chain must
# survive; if it does not, the derivation is broken, not the value.
ontapStoragePrefix: trident_

interval: 15s
lookback: 10m

# Stamped onto every emitted series. kube-state-graph pushes ?az= / ?env= to
# upstream PromQL as raw matchers against EVERY topology family, so a Harvest
# series missing them silently drops out of any filtered request.
extraLabels:
  az: local-a
  env: demo

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
