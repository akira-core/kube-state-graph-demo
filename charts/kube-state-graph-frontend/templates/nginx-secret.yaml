{{- $auth := .Values.global.ksgUpstreamAuth | required "global.ksgUpstreamAuth is required: the label-values proxy attaches it in-cluster so the browser never holds it" }}
# A COMPLETE replacement for the image's /etc/nginx/nginx.conf, which the
# frontend image documents as its override point.
#
# A Secret rather than a ConfigMap because it embeds the vmauth basic-auth
# header. That header is the whole point: the identity filter controls read
# kube_pod_info label values from a store behind basic auth, and attaching the
# credential here means the browser never sees it.
#
# Everything but the proxy blocks is the image's shipped conf, kept verbatim
# — /healthz, /config.json, the immutable /assets/ caching, the SPA fallback,
# the temp paths under /tmp and the security-headers include. The proxy blocks
# follow the rules the image's entrypoint applies to the ones it generates:
# GET/HEAD only, the upstream's copies of the security headers hidden,
# /api/metrics never forwarded, and nothing under /metrics-api/ but label
# enumeration. Nothing here is inherited from the image, so if the image's
# conf or entrypoint changes, this file has to be brought along; verify.sh
# asserts /healthz, /config.json, the Content-Security-Policy header and both
# 404s so a drift that breaks any of them is caught.
#
# There is deliberately NO `include /tmp/api_proxy.conf;` (nor
# /tmp/metrics_proxy.conf) here, and the Deployment leaves
# KSG_API_PROXY_TARGET unset. The image's entrypoint still writes those files;
# they are simply not included. Including one AND defining its location below
# would be a duplicate location and nginx would refuse to start.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-state-graph-frontend.fullname" . }}-nginx
  labels:
    {{- include "kube-state-graph-frontend.labels" . | nindent 4 }}
type: Opaque
stringData:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;
        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_vary on;
        # No version in the Server header or on nginx's own error pages.
        server_tokens off;

        # The Deployment runs a read-only root filesystem with /tmp as its only
        # writable mount. Without these nginx falls back to its compiled-in
        # /var/cache/nginx, which that root cannot provide.
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        # kube-dns, so an upstream that is not yet resolvable at start-up does
        # not make nginx refuse to load.
        resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

        server {
            listen {{ .Values.containerPort }};
            server_name _;
            root /usr/share/nginx/html;
            absolute_redirect off;

            # Every location below includes this again: nginx does not inherit
            # add_header into a block that declares its own, and each of them
            # does (Cache-Control). The file ships in the image.
            include /etc/nginx/security-headers.conf;

            location = /healthz {
                # Content-Type comes from default_type, never add_header: add_header APPENDS,
                # so pairing it with a body nginx already typed emits TWO Content-Type headers.
                default_type text/plain;
                add_header Cache-Control no-store always;
                include /etc/nginx/security-headers.conf;
                return 200 "ok\n";
            }

            location = /config.json {
                alias /srv/config/config.json;
                # default_type only — an add_header Content-Type here would be a SECOND
                # Content-Type header on every /config.json response.
                default_type application/json;
                add_header Cache-Control no-store always;
                include /etc/nginx/security-headers.conf;
            }

            location /assets/ {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                include /etc/nginx/security-headers.conf;
                try_files $uri =404;
            }

            # The graph API. Same origin so the backend needs no CORS policy for
            # this front end. GET/HEAD only: the SPA never writes.
            location /api/ {
                limit_except GET { deny all; }
                proxy_pass {{ .Values.proxy.graph }}/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                # The browser policy is this server's to set: drop an upstream's
                # copy so each header reaches the browser exactly once.
                proxy_hide_header Content-Security-Policy;
                proxy_hide_header X-Frame-Options;
                proxy_hide_header Referrer-Policy;
                proxy_hide_header X-Content-Type-Options;
                add_header Cache-Control "no-store" always;
                include /etc/nginx/security-headers.conf;
            }

            # The backend's own Prometheus registry is for an in-cluster
            # scraper, not for a browser.
            location = /api/metrics {
                default_type text/plain;
                add_header Cache-Control no-store always;
                include /etc/nginx/security-headers.conf;
                return 404;
            }

            # Nothing under /metrics-api/ but label enumeration. Without this the
            # rest of the prefix falls through to the SPA fallback and answers
            # index.html with a 200.
            location /metrics-api/ {
                default_type text/plain;
                add_header Cache-Control no-store always;
                include /etc/nginx/security-headers.conf;
                return 404;
            }

            # Label values for the identity filter controls and the Sankey's
            # root candidates, and NOTHING else in the store: the prefix stops at
            # /api/v1/label/ so this path cannot be used to run arbitrary PromQL
            # with the credential attached.
            location /metrics-api/api/v1/label/ {
                limit_except GET { deny all; }
                proxy_pass {{ .Values.proxy.labelValues }}/api/v1/label/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Authorization "Basic {{ printf "%s:%s" $auth.username $auth.password | b64enc }}";
                proxy_hide_header Content-Security-Policy;
                proxy_hide_header X-Frame-Options;
                proxy_hide_header Referrer-Policy;
                proxy_hide_header X-Content-Type-Options;
                add_header Cache-Control "no-store" always;
                include /etc/nginx/security-headers.conf;
            }

            location / {
                add_header Cache-Control no-cache always;
                include /etc/nginx/security-headers.conf;
                try_files $uri $uri/ /index.html;
            }
        }
    }
