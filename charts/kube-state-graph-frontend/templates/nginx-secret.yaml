{{- $auth := .Values.global.ksgUpstreamAuth | required "global.ksgUpstreamAuth is required: the label-values proxy attaches it in-cluster so the browser never holds it" }}
# A COMPLETE replacement for the image's /etc/nginx/nginx.conf, which the
# frontend image documents as its override point.
#
# A Secret rather than a ConfigMap because it embeds the vmauth basic-auth
# header. That header is the whole point: the identity filter controls read
# kube_pod_info label values from a store behind basic auth, and attaching the
# credential here means the browser never sees it.
#
# Everything but the two proxy blocks is the image's shipped conf, kept verbatim
# — /healthz, /config.json, the immutable /assets/ caching and the SPA fallback.
# If the image's conf changes, this file has to be brought along; verify.sh
# asserts /healthz and /config.json so a drift that breaks either is caught.
#
# There is deliberately NO `include /tmp/api_proxy.conf;` here, and the
# Deployment leaves KSG_API_PROXY_TARGET unset. The image's entrypoint still
# writes that file; it is simply not included. Including it AND defining
# `location /api/` below would be a duplicate location and nginx would refuse to
# start.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-state-graph-frontend.fullname" . }}-nginx
  labels:
    {{- include "kube-state-graph-frontend.labels" . | nindent 4 }}
type: Opaque
stringData:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;
        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_vary on;

        # kube-dns, so an upstream that is not yet resolvable at start-up does
        # not make nginx refuse to load.
        resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

        server {
            listen {{ .Values.containerPort }};
            server_name _;
            root /usr/share/nginx/html;
            absolute_redirect off;

            add_header X-Content-Type-Options nosniff always;

            location = /healthz {
                # Content-Type comes from default_type, never add_header: add_header APPENDS,
                # so pairing it with a body nginx already typed emits TWO Content-Type headers.
                default_type text/plain;
                add_header Cache-Control no-store always;
                add_header X-Content-Type-Options nosniff always;
                return 200 "ok\n";
            }

            location = /config.json {
                alias /srv/config/config.json;
                # default_type only — an add_header Content-Type here would be a SECOND
                # Content-Type header on every /config.json response.
                default_type application/json;
                add_header Cache-Control no-store always;
                add_header X-Content-Type-Options nosniff always;
            }

            location /assets/ {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                add_header X-Content-Type-Options nosniff always;
                try_files $uri =404;
            }

            # The graph API and its edge-type catalogue. Same origin so the
            # backend needs no CORS policy for this front end.
            location /api/ {
                proxy_pass {{ .Values.proxy.graph }}/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                add_header Cache-Control "no-store" always;
                add_header X-Content-Type-Options nosniff always;
            }

            # Label values for the identity filter controls, and NOTHING else in
            # the store: the prefix stops at /api/v1/label/ so this path cannot
            # be used to run arbitrary PromQL with the credential attached.
            location /metrics-api/api/v1/label/ {
                proxy_pass {{ .Values.proxy.labelValues }}/api/v1/label/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Authorization "Basic {{ printf "%s:%s" $auth.username $auth.password | b64enc }}";
                add_header Cache-Control "no-store" always;
                add_header X-Content-Type-Options nosniff always;
            }

            location / {
                add_header Cache-Control no-cache always;
                add_header X-Content-Type-Options nosniff always;
                try_files $uri $uri/ /index.html;
            }
        }
    }
