{{- with .Values.global.ksgUpstreamAuth }}
# The credential vmauth demands on the single-node store's read path, in the
# form its consumers need it: kube-state-graph (routing table names these
# variables rather than carrying the values) and netapp-faker (discovers claims
# through the same proxy). The front door needs it too, but never as a Secret
# reference: its nginx config attaches the header in-cluster, so the browser
# driving the Cluster / AZ / Env / Namespace controls never holds a credential.
#
# vmauth's own copy is rendered by its chart from the same `global` key, so
# they never drift.
#
# This is a DEMO credential, checked into values.yaml on purpose: the demo has
# to come up offline and reproducibly, and a generated password would make the
# routing table's credential legs unverifiable from outside the cluster. Nothing
# here is a real secret and nothing outside this kind cluster can reach vmauth.
apiVersion: v1
kind: Secret
metadata:
  name: ksg-upstream-auth
  labels:
    app.kubernetes.io/name: ksg-upstream-auth
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
type: Opaque
stringData:
  username: {{ .username | quote }}
  password: {{ .password | quote }}
{{- end }}
