{{- /*
Tracked source: charts/ksg-demo/dashboards/. This repository is the sole
author; bring-up must not overwrite these files from another tree. The
ConfigMap name is fixed because Grafana's dashboardsConfigMaps values key
has to name it from a subchart, where the release name is not addressable.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ksg-dashboards
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: ksg-demo
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
