apiVersion: v2
name: ksg-demo
description: >-
  The whole kube-state-graph demo in one release: a synthetic Kubernetes estate,
  the metrics pipeline that describes it, and the Grafana panel that draws it.
type: application
version: 0.1.0
appVersion: demo

# Every dependency is pinned. A demo whose meaning changes when an upstream
# chart moves is not a demo — the exact kube-state-metrics chart below is the
# one the backend's own preconditions doc was verified against (8.4.0 / KSM
# 2.20.0), and the collector must be a build carrying the servicegraph connector.
dependencies:
  # Read/write split storage. Cluster flavour rather than single-node because
  # the backend talks to vmselect's tenant-scoped Prometheus API, and that path
  # (/select/<accountID>/prometheus) only exists in the cluster build.
  - name: victoria-metrics-cluster
    version: 0.49.0
    repository: https://victoriametrics.github.io/helm-charts/

  # The topology source. Eight collectors — see values.yaml.
  - name: kube-state-metrics
    version: 8.4.0
    repository: https://prometheus-community.github.io/helm-charts

  # Scrapes kube-state-metrics and the kubelets, turns demo traces into
  # service-graph metrics, and stamps the cluster / az / env external labels
  # that kube-state-metrics itself cannot produce.
  - name: opentelemetry-collector
    version: 0.170.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts

  - name: grafana
    version: 10.5.15
    repository: https://grafana.github.io/helm-charts

  # Implements NodeGetVolumeStats, which is the only way the kubelet reports
  # kubelet_volume_stats_* for volumes that are not hostPath.
  - name: csi-driver-nfs
    version: 4.13.4
    repository: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts

  - name: kube-state-graph
    version: 0.1.0
    repository: file://../kube-state-graph

  - name: netapp-faker
    version: 0.1.0
    repository: file://../netapp-faker

  - name: demo-workloads
    version: 0.1.0
    repository: file://../demo-workloads

  # Userspace NFS Ganesha export. Kernel nfsd does not load inside kind nodes;
  # this is the in-cluster server csi-driver-nfs carves subdirectories from.
  # First-party: no upstream chart exports a writable share without also being
  # a provisioner, and a provisioner's Ganesha only exports directories it
  # created for its own PVs.
  - name: nfs-server
    version: 0.1.0
    repository: file://../nfs-server
