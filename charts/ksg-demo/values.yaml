# ksg-demo — one release, whole demo.
#
# Service names are pinned with fullnameOverride throughout rather than derived
# from the release name. Half of these components address each other by URL in
# free-form config (the collector's remote-write endpoint, the backend's
# --prom-url, the faker's two endpoints), and a URL cannot be templated from
# inside a subchart's values. Fixed names keep every one of those honest.

# ---------------------------------------------------------------------------
# Values every subchart sees. Two things live here because more than one
# component has to agree on them exactly, and a copy in each block is a copy
# that can drift.
# ---------------------------------------------------------------------------
global:
  # The three labels kube-state-metrics cannot emit. TWO components stamp them
  # now that the estate is split across two stores — vmagent on what it scrapes,
  # the OpenTelemetry Collector on the service-graph series it derives — and
  # the backend composes them into the cluster identity `<az>-<env>-<cluster>`
  # (every id prefix, `labels.cluster`, `clusters[]`). `?az=` / `?env=` /
  # `?cluster=` are still pushed as raw matchers, so a value that differed
  # between the two would silently split the graph into two identities (or
  # drop half of it out of any filtered request). Both read from here.
  ksgExternalLabels:
    cluster: ksg-demo
    az: local-a
    env: demo

  # Demo-only credential for vmauth, which fronts the single-node store's read
  # path. Three components must agree on it: vmauth itself, kube-state-graph's
  # routing table, and netapp-faker's claim discovery. It is rendered into
  # Secrets, never passed as an argument, and the routing table names only the
  # environment VARIABLES — the backend rejects a routing file carrying a
  # literal password outright.
  ksgUpstreamAuth:
    username: ksg
    password: ksg-demo-not-a-real-secret

# ---------------------------------------------------------------------------
# VictoriaMetrics, store 1 of 2 — cluster flavour.
#
# Holds the NetApp Harvest series (netapp-faker writes them straight to
# vminsert) and the service-graph series the collector derives from traces.
# kube-state-metrics and kubelet series live in the single-node store below;
# kube-state-graph's routing table is what puts the two halves back together.
# ---------------------------------------------------------------------------
victoria-metrics-cluster:
  fullnameOverride: vm

  vmselect:
    replicaCount: 1
    service:
      # Exposed on a kind extraPortMapping so the demo can be cross-checked
      # with raw PromQL when the graph disagrees with expectations.
      type: NodePort
      nodePort: 30481
  vminsert:
    replicaCount: 1
  vmstorage:
    replicaCount: 1
    # Two days is plenty for a demo and keeps the laptop's disk out of it.
    retentionPeriod: 2d
    persistentVolume:
      # emptyDir: a restart losing the demo's metrics costs one scrape interval.
      enabled: false

# ---------------------------------------------------------------------------
# VictoriaMetrics, store 2 of 2 — single-node flavour.
#
# Holds everything vmagent scrapes: the kube-state-metrics families and the two
# kubelet volume-stats series. Single-node rather than a second cluster install
# on purpose — the two stores are meant to differ in SHAPE, not just in name.
# This one serves the Prometheus API under /prometheus, where the cluster build
# serves it under /select/<accountID>/prometheus, so a routing table that
# quietly assumed one URL layout could not work here.
#
# Nothing reads it directly: vmauth below is its read path.
# ---------------------------------------------------------------------------
victoria-metrics-single:
  server:
    fullnameOverride: vm-single
    # Two days, matching the cluster install. The graph is built over minutes.
    retentionPeriod: 2d
    persistentVolume:
      # emptyDir, as in the cluster store: a restart losing the demo's metrics
      # costs one scrape interval.
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

# ---------------------------------------------------------------------------
# vmagent — the collection half of the split.
#
# These two scrape jobs used to run inside the OpenTelemetry Collector. They
# moved here whole, node-proxy trick and metric filter included, because the
# series they produce now belong to a different store than the collector's own
# output. The collector keeps only what it alone can do: turning spans into
# service-graph metrics.
# ---------------------------------------------------------------------------
victoria-metrics-agent:
  fullnameOverride: vm-agent

  remoteWrite:
    - url: http://vm-single:8428/api/v1/write

  rbac:
    create: true
    # The kubelet job reaches port 10250 through the API server's node proxy
    # rather than directly, which needs the ServiceAccount token and nothing
    # else — a direct scrape would need the kubelet's serving CA. The chart's
    # own ClusterRole grants nodes and nodes/metrics but not nodes/proxy.
    extraRules:
      - apiGroups: ['']
        resources:
          - nodes/proxy
        verbs: ['get', 'list', 'watch']

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  config:
    # The chart passes this config through `tpl` only when asked, and the three
    # external labels below have to come from one place — see `global` at the
    # top of this file.
    useTpl: true

    global:
      scrape_interval: 15s
      # Stamped on every scraped series. The collector stamps the same three
      # onto the service-graph series, from the same source.
      external_labels:
        cluster: "{{ .Values.global.ksgExternalLabels.cluster }}"
        az: "{{ .Values.global.ksgExternalLabels.az }}"
        env: "{{ .Values.global.ksgExternalLabels.env }}"

    # Replaces the chart's default job list wholesale. vmagent's own self-scrape
    # goes with it: this demo reads none of its series, and an extra job is an
    # extra thing to explain.
    scrape_configs:
      - job_name: kube-state-metrics
        static_configs:
          - targets: ['ksm:8080']

      # kubelet, reached through the API server's node proxy rather than port
      # 10250 directly: the proxy needs only the ServiceAccount token, where a
      # direct scrape would need the kubelet's serving CA.
      - job_name: kubelet
        scrape_interval: 30s
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics
        metric_relabel_configs:
          # The kubelet exposes hundreds of series; the graph reads two.
          - source_labels: [__name__]
            regex: kubelet_volume_stats_(used|capacity)_bytes
            action: keep

# ---------------------------------------------------------------------------
# vmauth — basic auth in front of the single-node store's READ path.
#
# It exists so the demo exercises the half of kube-state-graph's routing table
# that handles credentials: a backend names the environment VARIABLES holding
# its pair, never the pair itself, and a variable that is unset or empty is a
# load failure rather than a quiet fallback to no credentials.
#
# Reads only. vmagent writes to vm-single directly — authenticating the write
# path would prove nothing about the backend.
# ---------------------------------------------------------------------------
victoria-metrics-auth:
  fullnameOverride: vm-auth

  # configRaw rather than config: it is passed through `tpl`, which is what lets
  # the credential live once in `global` instead of once here and once in the
  # Secret the backend and the faker read.
  configRaw: |
    users:
      - username: {{ .Values.global.ksgUpstreamAuth.username | quote }}
        password: {{ .Values.global.ksgUpstreamAuth.password | quote }}
        # vmauth appends the request path to this prefix, so the backend asking
        # for /api/v1/query_range lands on
        # http://vm-single:8428/prometheus/api/v1/query_range.
        url_prefix: "http://vm-single:8428/prometheus"

  service:
    type: NodePort
    # Exposed on a kind extraPortMapping for the same reason vmselect is: when
    # the graph disagrees with what you think the metrics say, you need to ask
    # BOTH stores in raw PromQL. This one wants `curl -u`.
    nodePort: 30427

  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

# ---------------------------------------------------------------------------
# kube-state-metrics — the topology half of the graph.
#
# The collector list and the two allowlists below are lifted from the backend's
# own docs/kube-state-metrics-preconditions.md. Trimming `collectors` is what
# trims the generated ClusterRole, so this list is also the RBAC.
# ---------------------------------------------------------------------------
kube-state-metrics:
  fullnameOverride: ksm

  # Eleven collectors, covering all 22 series the backend queries. The first six
  # carry the graph itself; the last five exist SOLELY to resolve pod ArgoCD
  # Applications and are individually optional — omit any one and pods of that
  # controller kind carry no `application`, and nothing else changes.
  #
  # Two of the five also carry an owner series the graph needs for more than
  # Applications, so neither collector may be dropped to save cardinality:
  # `replicasets` carries kube_replicaset_owner (the ReplicaSet -> Deployment
  # skip) and `jobs` carries kube_job_owner (the Job -> CronJob hop). The
  # per-resource annotation allowlist below is the lever instead.
  collectors:
    - endpointslices
    - nodes
    - persistentvolumeclaims
    - pods
    - replicasets
    - services
    # Pod ArgoCD Application: the tracking-id lives on the controller ArgoCD
    # applied, never on the pods it spawns. Drop either the collector or the
    # allowlist entry and that kind's pods nest under controller with no
    # application group.
    - cronjobs
    - daemonsets
    - deployments
    - jobs
    - statefulsets

  # All 22 series the graph reads. Nothing else. This estate exercises only the
  # Deployment and StatefulSet annotation families — the other four resolve to
  # empty vectors here, which is the backend's designed per-family degradation
  # rather than a fault. They are listed so this file is the reference config
  # rather than the subset one demo happens to need.
  metricAllowlist:
    - kube_pod_info
    - kube_pod_owner
    - kube_pod_container_info
    - kube_pod_spec_volumes_persistentvolumeclaims_info
    - kube_node_info
    - kube_node_labels
    - kube_node_status_addresses
    - kube_node_status_condition
    - kube_service_info
    - kube_service_annotations
    - kube_persistentvolumeclaim_info
    - kube_persistentvolumeclaim_annotations
    - kube_replicaset_owner
    - kube_endpointslice_endpoints
    - kube_endpointslice_labels
    # Pod ArgoCD Application.
    - kube_job_owner
    - kube_deployment_annotations
    - kube_statefulset_annotations
    - kube_daemonset_annotations
    - kube_replicaset_annotations
    - kube_job_annotations
    - kube_cronjob_annotations

  # NOT a kube-state-metrics default, and REQUIRED: without it
  # kube_endpointslice_labels carries no label_kubernetes_io_service_name, the
  # EndpointSlice cannot be joined to its Service, and every service-selects-pod
  # edge disappears.
  #
  # (The chart really does spell its two allowlists inconsistently —
  # `metricLabelsAllowlist` vs `metricAnnotationsAllowList`. Not a typo here.)
  metricLabelsAllowlist:
    - endpointslices=[kubernetes.io/service-name]
    - nodes=[topology.kubernetes.io/zone,topology.kubernetes.io/region]

  # Gives Services, PVCs, and — through the pod's controller — pods their
  # `application`, which is what nests them under an application group. The flag
  # is per-resource, so each line can be dropped on its own.
  #
  # `replicasets` and `jobs` are the two expensive families — old ReplicaSets are
  # retained under a Deployment's revisionHistoryLimit and Jobs accumulate under
  # a CronJob's history limits — and the ReplicaSet family is consulted only for
  # a BARE ReplicaSet, the normal case having already collapsed to its
  # Deployment. A cluster running no ArgoCD-managed bare ReplicaSets or Jobs can
  # drop those two lines (and their two metricAllowlist entries) and pay nothing.
  metricAnnotationsAllowList:
    - services=[argocd.argoproj.io/tracking-id]
    - persistentvolumeclaims=[argocd.argoproj.io/tracking-id]
    # Pod ArgoCD Application — one entry per controller kind you run.
    - deployments=[argocd.argoproj.io/tracking-id]
    - statefulsets=[argocd.argoproj.io/tracking-id]
    - daemonsets=[argocd.argoproj.io/tracking-id]
    - replicasets=[argocd.argoproj.io/tracking-id]
    - jobs=[argocd.argoproj.io/tracking-id]
    - cronjobs=[argocd.argoproj.io/tracking-id]

  rbac:
    create: true
  autosharding:
    enabled: false
  prometheus:
    monitor:
      enabled: false

# ---------------------------------------------------------------------------
# OpenTelemetry Collector — the piece that makes the other pieces joinable.
#
# Two jobs, neither of which any other component can do:
#   1. turn the demo's traces into traces_service_graph_* metrics carrying
#      client_k8s_pod_uid / server_k8s_pod_uid;
#   2. stamp cluster / az / env on them, which no exporter here emits itself.
#
# It scrapes NOTHING. The kube-state-metrics and kubelet jobs moved to vmagent
# when the estate was split across two stores, because the series they produce
# belong to the other one.
# ---------------------------------------------------------------------------
opentelemetry-collector:
  fullnameOverride: otel-collector
  mode: deployment
  replicaCount: 1

  # contrib, not core: the servicegraph connector and the prometheusremotewrite
  # exporter both live there.
  image:
    repository: otel/opentelemetry-collector-contrib
  command:
    name: otelcol-contrib

  # No Kubernetes SD and no scrape targets left: the collector receives OTLP
  # from the workloads and writes to VictoriaMetrics, and needs no API access
  # for either. vmagent carries the node-proxy permissions now.
  clusterRole:
    create: false

  # Trace intake is OTLP only; the demo has no Jaeger or Zipkin producers.
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

  resources:
    limits:
      memory: 512Mi

  # No `receivers:` override any more. The chart's own otlp receiver is all
  # this collector needs: the two scrape jobs that used to sit here —
  # kube-state-metrics and the kubelets — are vmagent's now, carried over
  # verbatim in the victoria-metrics-agent block above.
  config:
    connectors:
      # Pairs each CLIENT span with the SERVER span it caused and emits the
      # RED triplet the backend joins by exact series identity.
      service_graph:
        latency_histogram_buckets: [2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s]
        # Becomes client_k8s_pod_uid / server_k8s_pod_uid — the ONLY thing that
        # resolves a call edge to a pod instead of an `external` node.
        dimensions:
          - k8s.pod.uid
        # A client span that never finds its server span becomes a VIRTUAL node
        # labelled with the first of these attributes it carries. Only
        # peer.service is listed, and only the deliberate connection-string
        # spans set it — adding an attribute the HTTP instrumentation also sets
        # (server.address, for one) would make every genuinely lost span pair
        # masquerade as a resolvable peer.
        virtual_node_peer_attributes:
          - peer.service
        store:
          ttl: 10s
          max_items: 20000
        metrics_flush_interval: 15s

    processors:
      # The pod UID arrives as a RESOURCE attribute (downward API). Copying it
      # onto the span makes the connector's dimension lookup independent of
      # whether that particular build also searches resource attributes.
      transform/pod-uid:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["k8s.pod.uid"], resource.attributes["k8s.pod.uid"])

      # With suffixes off the latency histogram arrives as
      # traces_service_graph_request_server (unit seconds, stripped). The
      # backend queries traces_service_graph_request_server_seconds_bucket by
      # name, so put the unit back before export — without this every edge
      # silently loses p90ServerMs.
      transform/servicegraph-names:
        error_mode: ignore
        metric_statements:
          - context: metric
            statements:
              - set(name, "traces_service_graph_request_server_seconds") where name == "traces_service_graph_request_server"
              - set(name, "traces_service_graph_request_client_seconds") where name == "traces_service_graph_request_client"

      # The three labels kube-state-metrics cannot produce. Every graph id is
      # cluster-scoped, and ?az= / ?env= are pushed to upstream PromQL as raw
      # matchers against every topology family — so these must reach ALL of
      # them, kubelet and service-graph series included.
      transform/external-labels:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["cluster"], "{{ .Values.global.ksgExternalLabels.cluster }}")
              - set(attributes["az"], "{{ .Values.global.ksgExternalLabels.az }}")
              - set(attributes["env"], "{{ .Values.global.ksgExternalLabels.env }}")

    exporters:
      prometheus_remote_write:
        endpoint: http://vm-vminsert:8480/insert/0/prometheus/api/v1/write
        tls:
          insecure: true
        # Suffixes OFF. The connector already names its counter
        # traces_service_graph_request_total; letting the exporter append its
        # own _total would produce ..._total_total and the backend's query
        # would match nothing. The cost is that the latency histogram also
        # loses its unit suffix, which transform/servicegraph-names restores.
        translation_strategy: UnderscoreEscapingWithoutSuffixes
        target_info:
          enabled: false
        resource_to_telemetry_conversion:
          enabled: false

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform/pod-uid, batch]
          exporters: [service_graph]
        metrics:
          receivers: [service_graph]
          processors: [memory_limiter, transform/servicegraph-names, transform/external-labels, batch]
          exporters: [prometheus_remote_write]

# ---------------------------------------------------------------------------
# kube-state-graph — the API the front door calls.
# ---------------------------------------------------------------------------
kube-state-graph:
  fullnameOverride: kube-state-graph

  # Still required, and still validated, but no longer where the queries go:
  # `backends` below wins and the server says so at WARN. Kept pointed at the
  # cluster store so removing the routing table is a one-line rollback to the
  # single-upstream deployment this demo used to be.
  promURL: http://vm-vmselect:8481/select/0/prometheus

  # The routing table. Every one of the ~40 PromQL queries a build issues is
  # dispatched through it, by metric family.
  #
  # The split is by producer: what vmagent scrapes lands in the single-node
  # store, what the collector and the faker write lands in the cluster store.
  # That puts the two halves of the storage join in DIFFERENT stores —
  # kube_persistentvolumeclaim_info here, volume_labels there — so a
  # pvc-to-netapp-aggr edge in the rendered graph is proof the fan-out and the
  # merge both work. `make wait` already gates on exactly that edge.
  #
  # `probe` is listed on BOTH: it is the up{} store-health family, it accepts no
  # request-scoped matcher, and listing it twice is what makes /readyz ask both
  # stores instead of declaring the estate healthy on the strength of one.
  #
  # No `zones` on either entry. Zone routing is real, but this demo stamps a
  # single az value across the whole estate, so declaring zones here would be
  # decoration that never selects anything.
  backends:
    - name: cluster-store
      # Tenant-scoped read path. The cluster build serves the Prometheus API
      # under /select/<accountID>/prometheus, and the backend appends
      # /api/v1/... to whatever base it is given.
      url: http://vm-vmselect:8481/select/0/prometheus
      families: [harvest, servicegraph, probe]
    - name: single-store
      # Through vmauth, not to vm-single directly: the credential legs of the
      # routing table are only exercised if something actually demands them.
      # vmauth appends the request path to its own url_prefix, so no /prometheus
      # here — see the victoria-metrics-auth block.
      url: http://vm-auth:8427
      families: [ksm, kubelet, probe]
      # NAMES of environment variables, never values. A routing file carrying a
      # literal password is rejected outright, and a variable named here but
      # unset is a load failure rather than a quiet fallback to no credentials.
      usernameEnv: KSG_UPSTREAM_USERNAME
      passwordEnv: KSG_UPSTREAM_PASSWORD

  extraEnv:
    - name: KSG_UPSTREAM_USERNAME
      valueFrom:
        secretKeyRef:
          name: ksg-upstream-auth
          key: username
    - name: KSG_UPSTREAM_PASSWORD
      valueFrom:
        secretKeyRef:
          name: ksg-upstream-auth
          key: password

  azLabel: az
  envLabel: env
  service:
    type: NodePort
    nodePort: 30080

# ---------------------------------------------------------------------------
# netapp-faker — the one component that is not real.
# ---------------------------------------------------------------------------
netapp-faker:
  # Discovery reads kube_persistentvolumeclaim_info, which is a kube-state-metrics
  # family and therefore lives in the single-node store behind vmauth. Writes go
  # to the cluster store, where the rest of the Harvest series live. The faker is
  # the one component that reads from one store and writes to the other.
  vmSelectURL: http://vm-auth:8427
  vmSelectAuthSecret: ksg-upstream-auth
  vmInsertURL: http://vm-vminsert:8480/insert/0/prometheus
  storageClass: netapp-nas
  # az / env are seeded from global.ksgExternalLabels — the faker is the third
  # component stamping them and all three have to agree exactly. Add a key here
  # only to override one of them for this component alone.
  extraLabels: {}

# ---------------------------------------------------------------------------
# In-cluster NFS server — one Ganesha export. csi-driver-nfs provisions a
# subdirectory per claim on it. 20Gi is enough for every demo claim (design
# Open Question 1 — the figure is a non-goal).
# ---------------------------------------------------------------------------
nfs-server:
  fullnameOverride: nfs-server
  persistence:
    storageClass: standard
    size: 20Gi

# ---------------------------------------------------------------------------
# CSI NFS driver — NodeGetVolumeStats is what makes kubelet_volume_stats_*
# exist for the demo claims. Controller stays at 1 replica: it uses hostNetwork
# and a fixed liveness-probe host port, so two replicas cannot share a node.
# ---------------------------------------------------------------------------
csi-driver-nfs:
  controller:
    replicas: 1
    dnsPolicy: ClusterFirstWithHostNet
  node:
    dnsPolicy: ClusterFirstWithHostNet

# ---------------------------------------------------------------------------
# The estate being drawn.
# ---------------------------------------------------------------------------
demo-workloads:
  otlpEndpoint: http://otel-collector.monitoring.svc.cluster.local:4317
  storageClass:
    create: true
    name: netapp-nas
    provisioner: nfs.csi.k8s.io
    volumeBindingMode: Immediate
    reclaimPolicy: Delete
    parameters:
      server: nfs-server.monitoring.svc.cluster.local
      share: /
    mountOptions:
      - nfsvers=4.1

# ---------------------------------------------------------------------------
# The front door. A static SPA behind nginx, on the host port this demo has
# always published its UI on (3001 -> nodePort 30300).
#
# Everything the browser asks for it asks of THIS origin: /api/ reaches the
# backend, /metrics-api/api/v1/label/ reaches vmauth with the credential
# attached in-cluster. Two reasons, both load-bearing. The backend would
# otherwise need a CORS policy naming this origin, and the pod-inventory store
# is behind basic auth that must not reach a browser.
#
# The chart replaces the image's /etc/nginx/nginx.conf wholesale, which is the
# override point the frontend image documents. Do not also set
# KSG_API_PROXY_TARGET: it makes the image's entrypoint write a second
# `location /api/`, and nginx refuses to start on a duplicate location.
# ---------------------------------------------------------------------------
kube-state-graph-frontend:
  fullnameOverride: kube-state-graph-frontend

  service:
    type: NodePort
    nodePort: 30300

  config:
    # Never true here. `true` renders the frontend's own bundled showcase
    # fixture — a convincing graph that proves nothing about the pipeline
    # behind it, which is the one thing this demo exists to show.
    demoMode: false
    refreshIntervalSeconds: 0
    defaultLayout: fcose
    theme: system
    endpoints:
      graph: /api/v1/graph
      # A Prometheus API ROOT, not a query path. The identity filter controls
      # read kube_pod_info label values from it, which is the ONLY source that
      # yields values `?cluster=` can act on: the graph response carries the
      # composed `<az>-<env>-<cluster>` identity, and sending that back matches
      # no series and returns an empty 200.
      labelValues: /metrics-api
      edgeTypes: /api/v1/edge-types

  proxy:
    graph: http://kube-state-graph:8080
    labelValues: http://vm-auth:8427
